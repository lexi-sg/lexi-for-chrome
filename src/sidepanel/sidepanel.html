<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lexi — AI Legal Assistant</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div id="lexi-app">

    <!-- ==================== HEADER ==================== -->
    <header id="lexi-header">
      <!-- The web app's Lexi lockup (lexi-frontend BrandLockup), inline in
           currentColor. -->
      <div id="lexi-brand" role="img" aria-label="Lexi">
        <svg id="lexi-mark" viewBox="0 0 66.5 74.44" width="18" height="20" fill="currentColor" aria-hidden="true"><path d="M63.83,52.08,38.1,37.22l20-11.54-2.16,8.07a2.74,2.74,0,1,0,5.3,1.42L65.11,20.7a2.74,2.74,0,0,0-4-3.09L35.35,32.46V9.38l5.91,5.91a2.75,2.75,0,1,0,3.88-3.89L34.55.8a2.75,2.75,0,0,0-4.69,2V32.46l-20-11.54,8.07-2.16a2.75,2.75,0,1,0-1.42-5.31L2,17.33a2.74,2.74,0,0,0-.67,5L27.11,37.22l-20,11.54,2.16-8.07A2.75,2.75,0,0,0,4,39.27L.09,53.75a2.77,2.77,0,0,0,1,2.89,2.84,2.84,0,0,0,1.68.57,2.82,2.82,0,0,0,1.37-.37L29.86,42V65.06L24,59.16A2.75,2.75,0,1,0,20.06,63l10.6,10.6a2.77,2.77,0,0,0,1.94.8,2.76,2.76,0,0,0,2.75-2.74V42l20,11.54-8.07,2.16a2.75,2.75,0,0,0,.71,5.4,2.82,2.82,0,0,0,.71-.09l14.48-3.88a2.75,2.75,0,0,0,.66-5Z" /></svg>
        <svg id="lexi-logo" viewBox="84.8 0 147.73 74.44" width="40" height="20" fill="currentColor" aria-hidden="true"><path d="M122.38,64.56H84.8v-.93l5.57-4.48V17.39L84.8,12.9V12h18.09v.93l-5.56,4.49v41h18.48l5.64-8h.93Z" /><path d="M163.56,45.15v1.78h-30.7a12.92,12.92,0,0,0,13.22,12.76c6.88,0,10.52-2.71,12.84-5.57l.92.15v7.35a24.8,24.8,0,0,1-14.15,4.1,20.2,20.2,0,0,1-19.87-20.49c0-11.6,9-20.5,19.64-20.5S163.56,33.55,163.56,45.15Zm-30.7-3.64h23.66a10.66,10.66,0,0,0-11.06-10.36C138.19,31.15,132.86,36.87,132.86,41.51Z" /><path d="M211.46,64.56H193.29v-.93l4.4-3.79L189,49.56l-8.5,10.28,4.33,3.79v.93H168v-.93l5-4.1,12.37-14.3L173.34,30.92l-6-4.1v-.93h18.87v.93l-4.64,3.79L190,40.74l8.12-10.13-4.25-3.79v-.93h16.86v.93l-5.57,4.1L193.36,44.84l12.07,14.69,6,4.1Z" /><path d="M232.53,63.63v.93H214.74v-.93l5.57-4.48V31.93l-5.57-4.57v-.85L227,24.73V59.15ZM218.3,12A4.87,4.87,0,1,1,228,12a4.87,4.87,0,0,1-9.74,0Z" /></svg>
      </div>

      <!-- Model/tier selection is server-owned in account (product-chat) mode —
           the client sends no model on /llm/chat. This control is retained
           hidden only for the UI-less BYOK agent-mode escape hatch (the
           hermetic e2e seam), never surfaced to signed-in lawyers. -->
      <select id="model-picker" aria-label="Model" hidden></select>

      <button id="settings-btn" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M19.14 12.94a7.14 7.14 0 0 0 .05-.94 7.14 7.14 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.14.56-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.14 7.14 0 0 0-.05.94c0 .32.02.63.05.94L2.83 14.5a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.61.22l2.39-.96c.49.38 1.04.7 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.59-.24 1.14-.56 1.63-.94l2.39.96c.24.1.5.02.61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/>
        </svg>
      </button>
    </header>

    <!-- ================= ACCOUNT CHIP ================= -->
    <div id="account-chip" hidden>
      <button id="account-chip-btn" type="button" aria-haspopup="true" aria-expanded="false">
        <span id="account-avatar" aria-hidden="true"></span>
        <span id="account-email">Signed in</span>
        <span id="account-chevron" aria-hidden="true">▾</span>
      </button>
      <div id="account-menu" hidden>
        <div id="account-usage" class="account-usage"></div>
        <button id="account-signout-btn" type="button">Sign out</button>
      </div>
    </div>

    <!-- ================= CONTEXT CHIP ================= -->
    <div id="context-chip">
      <img id="context-favicon" alt="" width="14" height="14" />
      <span id="context-title">No page detected</span>
      <button id="context-toggle" type="button" aria-pressed="true" title="Toggle reading this page">
        <span id="context-toggle-label">Reading this page</span>
      </button>
    </div>

    <!-- ============= SESSION-EXPIRY / RE-AUTH BANNER ============= -->
    <div id="key-banner" hidden>
      <span id="key-banner-text">Your Lexi session ended — sign in again.</span>
      <button id="key-banner-btn" type="button">Sign in</button>
    </div>

    <!-- ============= FIRST-RUN SIGN-IN SCREEN ============= -->
    <div id="signin-screen" hidden>
      <div id="signin-card">
        <span id="signin-logo">
          <svg id="signin-lockup" viewBox="0 0 232.53 74.44" width="81" height="26" fill="currentColor" role="img" aria-label="Lexi"><path d="M122.38,64.56H84.8v-.93l5.57-4.48V17.39L84.8,12.9V12h18.09v.93l-5.56,4.49v41h18.48l5.64-8h.93Z" /><path d="M163.56,45.15v1.78h-30.7a12.92,12.92,0,0,0,13.22,12.76c6.88,0,10.52-2.71,12.84-5.57l.92.15v7.35a24.8,24.8,0,0,1-14.15,4.1,20.2,20.2,0,0,1-19.87-20.49c0-11.6,9-20.5,19.64-20.5S163.56,33.55,163.56,45.15Zm-30.7-3.64h23.66a10.66,10.66,0,0,0-11.06-10.36C138.19,31.15,132.86,36.87,132.86,41.51Z" /><path d="M211.46,64.56H193.29v-.93l4.4-3.79L189,49.56l-8.5,10.28,4.33,3.79v.93H168v-.93l5-4.1,12.37-14.3L173.34,30.92l-6-4.1v-.93h18.87v.93l-4.64,3.79L190,40.74l8.12-10.13-4.25-3.79v-.93h16.86v.93l-5.57,4.1L193.36,44.84l12.07,14.69,6,4.1Z" /><path d="M232.53,63.63v.93H214.74v-.93l5.57-4.48V31.93l-5.57-4.57v-.85L227,24.73V59.15ZM218.3,12A4.87,4.87,0,1,1,228,12a4.87,4.87,0,0,1-9.74,0Z" /><path d="M63.83,52.08,38.1,37.22l20-11.54-2.16,8.07a2.74,2.74,0,1,0,5.3,1.42L65.11,20.7a2.74,2.74,0,0,0-4-3.09L35.35,32.46V9.38l5.91,5.91a2.75,2.75,0,1,0,3.88-3.89L34.55.8a2.75,2.75,0,0,0-4.69,2V32.46l-20-11.54,8.07-2.16a2.75,2.75,0,1,0-1.42-5.31L2,17.33a2.74,2.74,0,0,0-.67,5L27.11,37.22l-20,11.54,2.16-8.07A2.75,2.75,0,0,0,4,39.27L.09,53.75a2.77,2.77,0,0,0,1,2.89,2.84,2.84,0,0,0,1.68.57,2.82,2.82,0,0,0,1.37-.37L29.86,42V65.06L24,59.16A2.75,2.75,0,1,0,20.06,63l10.6,10.6a2.77,2.77,0,0,0,1.94.8,2.76,2.76,0,0,0,2.75-2.74V42l20,11.54-8.07,2.16a2.75,2.75,0,0,0,.71,5.4,2.82,2.82,0,0,0,.71-.09l14.48-3.88a2.75,2.75,0,0,0,.66-5Z" /></svg>
        </span>
        <h2 id="signin-title">The Lexi you use at work, on every page</h2>
        <p id="signin-sub">Sign in with your Lexi account to read, analyze, and act on the page you’re on.</p>
        <button id="signin-btn" type="button">Sign in with Lexi</button>
        <p id="signin-waiting" hidden>Waiting for sign-in in the new tab…</p>
      </div>
    </div>

    <!-- ================== MESSAGES LOG ================== -->
    <main id="messages" role="log" aria-live="polite" aria-label="Conversation"></main>

    <!-- Confirmation card template — cloned into #messages when a risky
         agent action needs explicit human approval. -->
    <template id="confirm-card-template">
      <div class="lexi-confirm-card" role="alertdialog" aria-label="Confirm action">
        <p class="lexi-confirm-heading">Lexi wants to:</p>
        <p id="confirm-desc" class="lexi-confirm-desc"></p>
        <label class="lexi-confirm-remember">
          <input type="checkbox" id="confirm-remember" />
          <span>Always allow this action on this site</span>
        </label>
        <div class="lexi-confirm-actions">
          <button id="confirm-deny" type="button" class="lexi-btn lexi-btn-muted">Deny</button>
          <button id="confirm-approve" type="button" class="lexi-btn lexi-btn-accent">Approve</button>
        </div>
      </div>
    </template>

    <!-- ================== ACTING BAR ================== -->
    <div id="acting-bar" hidden>
      <span id="acting-dot" aria-hidden="true"></span>
      <span id="acting-intent">Lexi is acting</span>
      <span id="acting-control" hidden></span>
      <button id="stop-btn" type="button">Stop</button>
    </div>

    <!-- =============== AGENT ENABLE PROMPT =============== -->
    <div id="agent-enable-row" hidden>
      <span>Agent actions are off on this site.</span>
      <button id="agent-enable-btn" type="button">Enable agent actions on this site</button>
    </div>

    <!-- ================ QUICK ACTIONS ROW ================ -->
    <div id="quick-actions-wrap">
      <div id="quick-actions" role="toolbar" aria-label="Quick actions"></div>
      <button id="quick-actions-more" type="button" aria-haspopup="true" aria-expanded="false">+more</button>
      <div id="secondary-actions-menu" hidden></div>
    </div>

    <!-- ================== COST HINT ==================== -->
    <div id="cost-hint" hidden></div>

    <!-- =================== COMPOSER ===================== -->
    <form id="composer" autocomplete="off">
      <div id="mode-toggle" role="tablist" aria-label="Chat or Agent mode">
        <button type="button" id="mode-chat-btn" role="tab" aria-selected="true" data-mode="chat">Chat</button>
        <button type="button" id="mode-agent-btn" role="tab" aria-selected="false" data-mode="agent">Agent</button>
      </div>

      <div id="composer-input-row">
        <textarea
          id="prompt-input"
          rows="1"
          placeholder="Ask about this page, or type / for quick actions…"
          aria-label="Message Lexi"
        ></textarea>
        <button id="send-btn" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M3.4 20.6 22 12 3.4 3.4 3.4 10.2 16 12 3.4 13.8Z"/>
          </svg>
        </button>
        <!-- While a chat answer streams, Send gives way to Stop (the web app's
             SendStopButton). -->
        <button id="chat-stop-btn" type="button" hidden>
          Stop<span class="lexi-stop-square" aria-hidden="true"></span>
        </button>
      </div>

      <div id="slash-menu" hidden></div>
    </form>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
